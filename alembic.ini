# Configuración de Alembic para baskonia-pipeline.
# El script de migración vive en packages/baskonia_core/db/migrations/.
[alembic]
script_location = packages/baskonia_core/db/migrations
prepend_sys_path = .
# La URL se lee de config.DATABASE_URL en env.py (no se hardcodea aquí).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
