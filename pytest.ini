[pytest]
# Añade la raíz del proyecto y packages/ al sys.path para que los imports
# (config, db, scraper, stats, insights, main, packages.baskonia_core)
# funcionen sin instalar el paquete.
pythonpath = . tools packages
testpaths = tests
# Los tests no deben tocar la BD real de data/baskonia.db
addopts = -q
