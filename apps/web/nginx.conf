server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida sirve index.html (react-router controla el resto).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API (apps/api) — servicio "api" en docker-compose (ver 03_deplyment_design.md).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
